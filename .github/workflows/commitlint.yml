name: commitlint

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
      - name: Lint PR title (must be a Conventional Commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --config commitlint.config.js
      - name: Lint commits in PR
        run: |
          npx commitlint \
            --from origin/${{ github.event.pull_request.base.ref }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --config commitlint.config.js \
            --verbose
