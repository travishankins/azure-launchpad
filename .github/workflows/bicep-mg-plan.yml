name: bicep-mg-plan

on:
  pull_request:
    paths:
      - "infra/bicep/management-groups/**"
      - ".github/workflows/bicep-mg-*.yml"

permissions:
  id-token: write
  contents: read

env:
  WORKING_DIR: infra/bicep/management-groups

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bicep build
        run: az bicep build --file ${{ env.WORKING_DIR }}/main.bicep --stdout >
          /dev/null
      - name: Bicep build-params (all scenarios)
        run: |
          for s in minimal full; do
            echo "=== $s ==="
            az bicep build-params --file ${{ env.WORKING_DIR }}/scenarios/$s.bicepparam --stdout > /dev/null
          done

  what-if:
    needs: build-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [ minimal, full ]
    environment: plan-mg
    steps:
      - uses: actions/checkout@v7
      - name: Azure login (OIDC, no subscription)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_MG_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: az deployment tenant what-if
        run: |
          az deployment tenant what-if \
            --location ${{ vars.AZURE_DEFAULT_LOCATION || 'westcentralus' }} \
            --name foundations-mg-${{ matrix.scenario }}-${{ github.run_number }} \
            --parameters ${{ env.WORKING_DIR }}/scenarios/${{ matrix.scenario }}.bicepparam
