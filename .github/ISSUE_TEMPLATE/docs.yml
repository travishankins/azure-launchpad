name: 📚 Docs improvement
description: Report a typo, broken link, unclear explanation, missing topic, or rendering bug on the docs site.
title: "[docs] "
labels: [ "docs", "triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make the docs better! Even a one-line typo report is welcome.

        For typos / broken links you can also open a PR directly — every page on the site has a "Source" link in its footer.
  - type: input
    id: page
    attributes:
      label: Page URL
      description: Paste the published URL or the relative path under `site/src/content/docs/`.
      placeholder: e.g. https://travishankins.github.io/azure-launchpad/scenarios/multi-subscription/
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of issue
      options:
        - Typo / grammar
        - Broken link
        - Unclear / confusing explanation
        - Out of date / inaccurate
        - Missing topic (something should be covered that isn't)
        - Rendering bug (Mermaid diagram, table, code block, callout)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Quote the offending text or describe the issue. Screenshots welcome for rendering bugs.
      placeholder: "The 'Pre-flight checklist' section says X, but the actual behavior is Y..."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
      description: If you have a specific change in mind, drop it here. A diff or rewritten paragraph is great.
    validations:
      required: false
